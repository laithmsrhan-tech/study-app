<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق الدراسة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#faf7f0;--card:#fff;--tx:#23201a;--mut:#6f685a;--ac:#c2185b;--acbg:#fce4ec;--bd:#e4ded0;--hl:#ffe7a3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17160f;--card:#211f17;--tx:#eee9dc;--mut:#a39b88;--ac:#f06292;--acbg:#3a1a27;--bd:#34311f;--hl:#5a4a14}}
:root[data-theme="dark"]{--bg:#17160f;--card:#211f17;--tx:#eee9dc;--mut:#a39b88;--ac:#f06292;--acbg:#3a1a27;--bd:#34311f;--hl:#5a4a14}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;font-size:16px}
button{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.top h1{flex:1;font-size:16px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;min-width:40px}
.ib.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ib:disabled{opacity:.4}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px}
.card{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:10px}
.card b{display:block;font-size:18px;color:var(--ac)}
.unit{font-weight:700;color:var(--ac);margin:20px 0 8px}
.les{display:flex;justify-content:space-between;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:6px;text-align:start}
.les span{color:var(--mut);font-size:13px;white-space:nowrap;margin-inline-start:10px}
#reader{display:none;flex-direction:column;height:100%}
#scroll{flex:1;overflow:auto;background:#8884;position:relative}
#pg{position:relative;margin:0 auto;width:100%}
.pgw{position:relative;width:100%;aspect-ratio:581/794;background:#fff;margin-bottom:6px}
.pgw.ph{aspect-ratio:auto}
.pgw img{display:block;width:100%;height:100%;-webkit-user-select:none;user-select:none}
.pgw.ph img{height:auto}
.ov{position:absolute;inset:0;display:none;touch-action:none;cursor:crosshair;background:rgba(194,24,91,.06)}
#pg.crop .ov{display:block}
#box{position:absolute;border:2px solid var(--ac);background:rgba(194,24,91,.18);display:none}
.nav .mid{cursor:pointer}
.nav{display:flex;gap:8px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.nav .mid{flex:1;text-align:center;font-size:14px;color:var(--mut)}
.hint{display:none;background:var(--ac);color:#fff;padding:8px 14px;font-size:14px;text-align:center}
.hint.on{display:block}
.qz{margin:14px;padding:14px;border-radius:12px;background:var(--acbg);text-align:center}
.qz button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
#shade.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:720px;margin:0 auto;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#sheet h3{margin:0 0 10px;font-size:17px}
#x{float:left;background:none;border:0;font-size:22px;color:var(--mut)}
#thumb{max-width:100%;max-height:130px;border:1px solid var(--bd);border-radius:8px;display:block;margin-bottom:10px;background:#fff}
.ans{line-height:2;white-space:pre-wrap;font-size:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:8px 14px;font-size:14px}
.q{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.q small{color:var(--ac);font-weight:700}
.q .ans{margin-top:8px;border-top:1px dashed var(--bd);padding-top:8px}
input[type=text],input[type=password]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;direction:ltr;margin:6px 0 12px}
ol{padding-inline-start:20px;line-height:2}
.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700}
#show{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#sbody{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;justify-content:center;max-width:720px;width:100%;margin:0 auto}
#st{color:var(--ac);font-size:26px;margin:0 0 10px;line-height:1.6}
#sl{list-style:none;padding:0;margin:0}
#sl li{opacity:0;transform:translateY(12px);transition:all .5s;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0;font-size:20px;line-height:1.8}
#sl li.vis{opacity:1;transform:none}
#nv{display:none;background:var(--hl);padding:8px 14px;font-size:13px;line-height:1.7}
#show .nav{justify-content:center;gap:16px}
#show .nav .ib{font-size:22px;padding:10px 18px}
</style>
</head>
<body>
<div id="home">
  <div class="top"><h1>📚 رفيق الدراسة</h1><button class="ib" id="setb">⚙️</button></div>
  <div class="wrap" id="homebody"></div>
</div>
<div id="toc" style="display:none">
  <div class="top"><button class="ib" id="tb">→</button><h1 id="tt"></h1></div>
  <div class="wrap" id="tocbody"></div>
</div>
<div id="reader">
  <div class="top"><button class="ib" id="rb">→</button><h1 id="rt"></h1><button class="ib" id="zm">🔍−</button><button class="ib" id="zp">🔍+</button></div>
  <div class="hint" id="hint">ارسم مستطيلاً بإصبعك حول الجزء الذي تريد شرحه</div>
  <div id="scroll"><div id="pg"><div id="bk"></div></div></div>
  <div class="nav"><button class="ib" id="nx">›</button><button class="ib" id="sel">✨ حدّد واشرح</button><div class="mid" id="cnt"></div><button class="ib" id="qb">🧠</button><button class="ib" id="pv">‹</button><button class="ib" id="whole" style="display:none">✨ اشرح الكل</button><button class="ib" id="newp" style="display:none">📷</button></div>
<input type="file" id="fcam" accept="image/*" capture="environment" hidden><input type="file" id="fgal" accept="image/*" hidden>
</div>
<div id="shade"><div id="sheet"><button id="x">✕</button><div id="sb"></div></div></div>

<div id="show"><div class="top"><button class="ib" id="sx">✕</button><h1 id="sn"></h1><button class="ib" id="spd">1×</button></div><div id="nv"></div><div id="sbody"><h2 id="st"></h2><ul id="sl"></ul></div><div class="nav"><button class="ib" id="sprv">⏮</button><button class="ib" id="pp">⏸</button><button class="ib" id="snx">⏭</button></div></div>
<script>
const BOOKS=[{id:"math1",title:"الرياضيات — الجزء الأول",sub:"الثالث الثانوي العلمي",total:252,
src:n=>"pages/p-"+String(n).padStart(3,"0")+".jpg",
units:[
{t:"المقدمة والمحتوى",p:1,i:[]},
{t:"1. تذكرة بالمتتاليات والإثبات بالتدريج",p:13,i:[["عموميات عن المتتاليات",14],["البرهان بالتدريج أو بالاستقراء الرياضي",19],["تمرينات ومسائل",22]]},
{t:"2. التوابع: النهايات والاستمرار",p:27,i:[["نهاية تابع عند اللانهاية",31],["نهاية تابع عند عدد حقيقي",35],["العمليات على النهايات",39],["مبرهنات المقارنة",43],["نهاية تابع مركّب",47],["المقارب المائل",50],["الاستمرار",52],["التوابع المستمرة وحل المعادلات",55],["أنشطة",64],["تمرينات ومسائل",67]]},
{t:"3. التوابع: الاشتقاق",p:77,i:[["تعاريف (تذكرة)",79],["مشتقات بعض التوابع المألوفة",82],["تطبيقات الاشتقاق",85],["اشتقاق تابع مركّب",90],["المشتقات من مراتب عليا",95],["أنشطة",98],["تمرينات ومسائل",104]]},
{t:"4. نهاية متتالية",p:113,i:[["نهاية متتالية: تذكرة",115],["مبرهنات تخص النهايات",120],["تقارب المتتاليات المطردة",124],["متتاليات متجاورة",129],["أنشطة",135],["تمرينات ومسائل",137]]},
{t:"5. التابع اللوغاريتمي النيبيري",p:147,i:[["التابع اللوغاريتمي النيبيري",151],["لوغاريتم جداء وضرب",155],["دراسة التابع ln",159],["مشتق التابع المركّب ln∘u",163],["نهايات مهمة",163],["أنشطة",168],["تمرينات ومسائل",171]]},
{t:"6. التابع الأسّي",p:181,i:[["التابع الأسّي النيبيري",183],["خواص التابع الأسّي",187],["دراسة التابع الأسّي",191],["نهايات مهمة",195],["دراسة توابع من النمط a^x",200],["معادلات تفاضلية بسيطة",204],["أنشطة",208],["تمرينات ومسائل",209]]},
{t:"7. التكامل والتوابع الأصلية",p:217,i:[["التوابع الأصلية",219],["بعض قواعد حساب التوابع الأصلية",223],["التكامل المحدّد وخواصه",228],["التكامل المحدّد وحساب المساحة",237],["أنشطة",242],["تمرينات ومسائل",244]]},
{t:"مسرد المصطلحات العلمية",p:251,i:[]}
]}];
const $=id=>document.getElementById(id);
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ld=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};
let B,LS=[],n=1,zoom=1,cropOn=false,crop=null;

function build(b){
  const L=[];
  b.units.forEach(u=>{
    const it=u.i.slice();
    if(!it.length||it[0][1]>u.p) it.unshift([it.length?"مدخل الوحدة":u.t,u.p]);
    it.forEach(x=>L.push({t:x[0],s:x[1],u:u.t}));
  });
  L.forEach((l,k)=>{l.e=k<L.length-1?Math.max(l.s,L[k+1].s-1):b.total});
  return L;
}
const lessonOf=p=>{let r=LS[0];LS.forEach(l=>{if(l.s<=p)r=l});return r};
function show(v){["home","toc"].forEach(x=>$(x).style.display=x===v?"block":"none");$("reader").style.display=v==="reader"?"flex":"none"}

BOOKS.forEach(b=>{const e=document.createElement("button");e.className="card";e.innerHTML="<b></b><span style='color:var(--mut)'></span>";e.children[0].textContent=b.title;e.children[1].textContent=b.sub;e.onclick=()=>openBook(b);$("homebody").appendChild(e)});
function openBook(b){
  B=b;LS=build(b);$("tt").textContent=b.title;const c=$("tocbody");c.innerHTML="";
  b.units.forEach(u=>{
    const h=document.createElement("div");h.className="unit";h.textContent=u.t;c.appendChild(h);
    LS.filter(l=>l.u===u.t).forEach(l=>{const e=document.createElement("button");e.className="les";e.innerHTML="<div></div><span></span>";e.children[0].textContent=l.t;e.children[1].textContent="ص "+l.s;e.onclick=()=>openPage(l.s);c.appendChild(e)});
  });
  show("toc");
}
$("tb").onclick=()=>show("home");
$("rb").onclick=()=>{setCrop(false);if(photoMode){navMode(false);show("home")}else show("toc")};

let builtFor=null,ioLoad=null,ioCur=null;
function mkWrap(){const d=document.createElement("div");d.className="pgw";d.innerHTML="<img alt=''><div class='ov'></div>";return d}
function stopIO(){if(ioLoad)ioLoad.disconnect();if(ioCur)ioCur.disconnect()}
function buildBook(){
  const bk=$("bk");bk.innerHTML="";stopIO();
  ioLoad=new IntersectionObserver(es=>es.forEach(e=>{const w=e.target,im=w.firstChild;
    if(e.isIntersecting){if(!im.getAttribute("src"))im.src=B.src(+w.dataset.p)}else if(im.getAttribute("src"))im.removeAttribute("src")}),{root:$("scroll"),rootMargin:"250% 0px"});
  ioCur=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setCur(+e.target.dataset.p)}),{root:$("scroll"),rootMargin:"-45% 0px -45% 0px"});
  const lastOf={};LS.forEach(l=>{if(!/^(مدخل|المقدمة|مسرد)/.test(l.t))lastOf[l.e]=l});
  for(let p=1;p<=B.total;p++){
    const w=mkWrap();w.dataset.p=p;bk.appendChild(w);ioLoad.observe(w);ioCur.observe(w);
    const l=lastOf[p];
    if(l){const q=document.createElement("div");q.className="qz";q.innerHTML="<div style='margin-bottom:10px'></div><button>🧠 اختبر نفسك</button>";
      q.firstChild.textContent="أنهيت درس «"+l.t+"»؟ اختبر فهمك";q.lastChild.onclick=()=>{n=l.e;quiz()};bk.appendChild(q)}
  }
  builtFor=B.id;
}
function setCur(p){n=p;$("rt").textContent=lessonOf(p).t;$("cnt").textContent="صفحة "+p+" / "+B.total;$("pv").disabled=p<=1;$("nx").disabled=p>=B.total}
function goTo(p){
  p=Math.max(1,Math.min(B.total,p));const w=$("bk").querySelector('[data-p="'+p+'"]');if(!w)return;
  const im=w.firstChild;if(!im.getAttribute("src"))im.src=B.src(p);
  $("scroll").scrollTop=w.offsetTop;setCur(p);
}
function openPage(p){navMode(false);show("reader");if(builtFor!==B.id)buildBook();goTo(p)}
$("pv").onclick=()=>goTo(n-1);$("nx").onclick=()=>goTo(n+1);
$("cnt").onclick=()=>{if(photoMode)return;
  open_("<h3>اذهب إلى صفحة</h3><input type='text' inputmode='numeric' id='gp' placeholder='1 - "+B.total+"'><button class='pri' id='gb'>اذهب</button>");
  const go=()=>{const v=parseInt($("gp").value);if(v){$("shade").classList.remove("on");goTo(v)}};
  $("gb").onclick=go;$("gp").addEventListener("keydown",e=>{if(e.key==="Enter")go()})};
function setZoom(z){zoom=Math.max(1,Math.min(3,z));$("pg").style.width=(zoom*100)+"%"}
$("zp").onclick=()=>setZoom(zoom+.5);$("zm").onclick=()=>setZoom(zoom-.5);
function setCrop(on){cropOn=on;$("pg").classList.toggle("crop",on);$("sel").classList.toggle("on",on);$("hint").classList.toggle("on",on);bx.style.display="none"}
$("sel").onclick=()=>setCrop(!cropOn);

/* رسم المستطيل (على أي صفحة) */
const bx=document.createElement("div");bx.id="box";let st=null,cur=null;
const pgEl=$("pg");
pgEl.addEventListener("pointerdown",e=>{const o=e.target.closest(".ov");if(!o||!cropOn)return;cur=o;const r=o.getBoundingClientRect();st={x:e.clientX-r.left,y:e.clientY-r.top};o.setPointerCapture(e.pointerId);o.appendChild(bx);bx.style.display="block";upd(st.x,st.y)});
pgEl.addEventListener("pointermove",e=>{if(!st)return;const r=cur.getBoundingClientRect();upd(e.clientX-r.left,e.clientY-r.top)});
function upd(x,y){const l=Math.min(st.x,x),t=Math.min(st.y,y);bx.style.left=l+"px";bx.style.top=t+"px";bx.style.width=Math.abs(x-st.x)+"px";bx.style.height=Math.abs(y-st.y)+"px"}
pgEl.addEventListener("pointerup",e=>{if(!st)return;const r=cur.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const l=Math.max(0,Math.min(st.x,x)),t=Math.max(0,Math.min(st.y,y)),w=Math.min(r.width-l,Math.abs(x-st.x)),h=Math.min(r.height-t,Math.abs(y-st.y));st=null;
  if(w<25||h<25){bx.style.display="none";return}
  const im=cur.parentNode.firstChild;if(!im.naturalWidth){bx.style.display="none";return}
  const k=im.naturalWidth/r.width,c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext("2d").drawImage(im,l*k,t*k,w*k,h*k,0,0,c.width,c.height);
  setCrop(false);explain(c.toDataURL("image/jpeg",.9).split(",")[1])});

/* نافذة سفلية */
const open_=(html)=>{$("sb").innerHTML=html;$("shade").classList.add("on")};
$("x").onclick=()=>$("shade").classList.remove("on");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\$/g,"").replace(/^#+\s*/gm,"");

/* Gemini */
const SYS="أنت معلم صبور متخصص في مواد الثالث الثانوي (الرياضيات والفيزياء والكيمياء والعلوم واللغات). إن كان جزء من الصورة غير واضح فاذكر ذلك ولا تخمّن. اكتب بالعربية المبسطة. اكتب المعادلات بصيغة نصية عادية (مثل x² و √ و ≤ و ∑ و lim) ولا تستخدم LaTeX ولا الرمز $. استخدم خطوات مرقمة قصيرة وعناوين قصيرة بلا مقدمات.\n";
async function gem(parts,json){
  const key=ld("gk");if(!key){settings(true);throw new Error("nokey")}
  const ms=[ld("gm")||"gemini-3.5-flash","gemini-2.5-flash"];
  for(let i=0;i<ms.length;i++){
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+ms[i]+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{parts}],generationConfig:json?{responseMimeType:"application/json"}:{}})});
    if(r.status===404&&i<ms.length-1)continue;
    if(!r.ok)throw new Error(String(r.status));
    const d=await r.json();const t=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
    if(!t)throw new Error("empty");return t}
}
const errMsg=e=>e.message==="nokey"?"":e.message==="429"?"وصلت إلى الحد المجاني مؤقتاً. انتظر دقيقة ثم حاول مجدداً.":(e.message==="400"||e.message==="403")?"المفتاح غير صالح. راجع الإعدادات ⚙️.":"تعذّر الاتصال الآن. حاول مرة أخرى.";

const MODES={
 explain:"الصورة فيها درس أو تمرين أو سؤال (من كتاب أو دفتر أو سبورة). اشرح ما فيها شرحاً توضيحياً مريحاً ومفهوماً: ابدأ بفكرته الأساسية في جملتين ثم فصّلها بخطوات. إن كان مثالاً أو تمريناً فحلّه خطوة بخطوة مع تعليل كل خطوة.",
 simple:"اشرح ما في الصورة مرة أخرى بطريقة أبسط بكثير كأنك تشرحه لطالب يجد المادة صعبة، مع تشبيه من الحياة اليومية.",
 example:"أعطِ مثالاً تطبيقياً واحداً أو اثنين مع حلّهما على الفكرة الموجودة في الصورة.",
 quiz:"اطرح 3 أسئلة قصيرة متدرجة لاختبار فهمي لما في الصورة، ولا تذكر الإجابات إلا في آخر الرد تحت عنوان «الإجابات»."};
let lastT="";
async function explain(b64,mode){
  mode=mode||"explain";
  if(mode==="show")return startShow(b64);
  if(mode==="verify")return verify(b64,lastT,$("vf"));
  open_("<img id='thumb' src='data:image/jpeg;base64,"+b64+"'><div class='ans' id='an'>⏳ جاري الشرح…</div><div class='acts' id='ac' style='display:none'><button class='chip' data-m='simple'>أبسط من ذلك</button><button class='chip' data-m='example'>أعطني مثالاً</button><button class='chip' data-m='quiz'>اختبرني</button><button class='chip' data-m='show' style='background:var(--ac);color:#fff;border-color:var(--ac)'>🎬 اعرض كشرائح</button><button class='chip' data-m='verify'>🔍 تحقق بنموذج ثانٍ</button></div><div class='ans' id='vf' style='margin-top:14px'></div>");
  try{const t=await gem([{text:SYS+MODES[mode]},{inline_data:{mime_type:"image/jpeg",data:b64}}]);
    $("an").innerHTML=fmt(t);lastT=t;$("ac").style.display="flex";
    $("ac").querySelectorAll("button").forEach(b=>b.onclick=()=>explain(b64,b.dataset.m))
  }catch(e){if(e.message!=="nokey")$("an").textContent=errMsg(e)}
}

/* التحقق بنموذج ثانٍ (Groq) */
async function verify(b64,txt,out){
  const k=ld("gq");
  if(!k){out.textContent="للتحقق أضف مفتاح Groq المجاني من ⚙️ الإعدادات.";return}
  if(!txt){out.textContent="لا يوجد شرح للتحقق منه بعد.";return}
  out.textContent="🔍 النموذج الثاني يراجع الحل…";
  const content=[{type:"text",text:"أنت مدقق صارم. هذا شرح أو حل كتبه مساعد آخر لما في الصورة (أو للسؤال المذكور). حُلّ المسألة بنفسك أولاً بشكل مستقل، ثم قارن حلّك بما كتبه المساعد. اكتب بالعربية المبسطة، والمعادلات نصاً عادياً بلا LaTeX. ابدأ ردك بسطر واحد إما «✅ متفق: لم أجد أخطاء» أو «⚠️ يوجد اختلاف»، ثم اشرح بإيجاز الخطأ وصحّحه إن وُجد.\nما كتبه المساعد:\n"+txt}];
  if(b64)content.push({type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}});
  const ms=[ld("gv")||"qwen/qwen3.8-27b","qwen/qwen3.6-27b"];
  try{
    for(let i=0;i<ms.length;i++){
      const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+k},body:JSON.stringify({model:ms[i],messages:[{role:"user",content}],temperature:0.2})});
      if((r.status===404||r.status===400)&&i<ms.length-1)continue;
      if(!r.ok){out.textContent=r.status===401?"مفتاح Groq غير صالح. راجع ⚙️.":r.status===429?"وصلت إلى الحد المجاني لـ Groq مؤقتاً. انتظر قليلاً.":"تعذّر التحقق الآن ("+r.status+").";return}
      const d=await r.json();let t=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
      t=t.replace(/<think>[\s\S]*?<\/think>/g,"").trim();
      out.innerHTML="<b>🔍 مراجعة نموذج ثانٍ:</b>\n"+fmt(t||"لم يصل رد.");return}
  }catch(e){out.textContent="تعذّر الاتصال بـ Groq. تأكد من الإنترنت ومن المفتاح."}
}

/* العرض التقديمي الناطق */
let S=[],si=0,sp=0,gen=0,playing=false,done=false,rate=1,hasAr=false;
const TTS="speechSynthesis" in window;
function chkVoice(){try{hasAr=TTS&&speechSynthesis.getVoices().some(v=>v.lang.toLowerCase().indexOf("ar")===0)}catch(e){hasAr=false}}
if(TTS){speechSynthesis.onvoiceschanged=chkVoice;chkVoice()}
async function startShow(b64){
  open_("<img id='thumb' src='data:image/jpeg;base64,"+b64+"'><div class='ans' id='an'>🎬 أجهّز العرض التقديمي… (قد يستغرق دقيقة)</div>");
  try{
    const t=await gem([{text:SYS+"الصورة فيها درس أو تمرين أو سؤال (من كتاب أو دفتر أو سبورة). حوّل شرحه إلى عرض تقديمي من 4 إلى 7 شرائح متسلسلة (الفكرة، القاعدة، مثال محلول خطوة بخطوة، ثم خطأ شائع أو ملخص). لكل شريحة: title عنوان قصير، وsteps من 2 إلى 4 خطوات، في كل خطوة text نص مكتوب قصير يظهر على الشاشة (المعادلات بصيغة نصية)، وsay جملة أو جملتان تُنطق بصوت المعلم بعربية مبسطة، وتُكتب فيها الرموز بالكلمات (مثل: x تربيع، جذر، أكبر من أو يساوي، ضرب). أعد JSON فقط بالشكل: {\"slides\":[{\"title\":\"\",\"steps\":[{\"text\":\"\",\"say\":\"\"}]}]}"},{inline_data:{mime_type:"image/jpeg",data:b64}}],true);
    const o=JSON.parse(t.replace(/```json|```/g,"").trim());
    S=(o.slides||o).map(s=>({title:s.title||"",steps:[{text:"",say:s.title||""}].concat((s.steps||[]).map(x=>({text:x.text||"",say:x.say||x.text||""})))}));
    if(!S.length)throw new SyntaxError("empty");
    $("shade").classList.remove("on");openShow();
  }catch(e){if(e.message!=="nokey")$("an").textContent=e instanceof SyntaxError?"تعذّر تجهيز العرض. أعد المحاولة.":errMsg(e)}
}
function openShow(){
  chkVoice();si=0;sp=0;playing=true;done=false;
  const nv=$("nv");nv.style.display=hasAr?"none":"block";
  nv.textContent=TTS?"لم أجد صوتاً عربياً على جهازك، فسيتقدم العرض تلقائياً بلا صوت. لتفعيل الصوت: إعدادات الهاتف ← تحويل النص إلى كلام (Google) ← تثبيت بيانات الصوت العربي.":"المتصفح لا يدعم الصوت، فسيتقدم العرض بلا صوت.";
  nv.style.display=hasAr?"none":"block";
  $("show").style.display="flex";buildSlide();go();
}
function buildSlide(){
  const s=S[si];$("sn").textContent=(si+1)+" / "+S.length;$("st").textContent=s.title;
  const ul=$("sl");ul.innerHTML="";
  s.steps.forEach((x,k)=>{if(!x.text)return;const li=document.createElement("li");li.textContent=x.text;li.dataset.k=k;ul.appendChild(li)});
}
function reveal(){$("sl").childNodes.forEach(li=>li.classList.toggle("vis",+li.dataset.k<=sp));$("pp").textContent=done?"🔁":playing?"⏸":"▶";$("spd").textContent=rate+"×"}
function stopTTS(){gen++;if(TTS)speechSynthesis.cancel()}
function go(){
  stopTTS();const g=gen;reveal();if(!playing)return;
  const x=S[si].steps[sp],next=()=>{if(g===gen&&playing)adv()};
  if(hasAr&&TTS){const u=new SpeechSynthesisUtterance(x.say);u.lang="ar-SA";u.rate=rate;u.onend=next;u.onerror=()=>setTimeout(next,Math.max(2500,x.say.length*70));speechSynthesis.speak(u)}
  else setTimeout(next,Math.max(3000,x.say.length*90/rate));
}
function adv(){
  if(sp<S[si].steps.length-1){sp++;go()}
  else if(si<S.length-1){si++;sp=0;buildSlide();go()}
  else{playing=false;done=true;stopTTS();reveal()}
}
function jump(d){stopTTS();si=Math.max(0,Math.min(S.length-1,si+d));sp=0;done=false;buildSlide();go()}
$("pp").onclick=()=>{if(done){done=false;playing=true;si=0;sp=0;buildSlide();go()}else{playing=!playing;if(playing)go();else{stopTTS();reveal()}}};
$("sprv").onclick=()=>jump(-1);$("snx").onclick=()=>jump(1);
$("spd").onclick=()=>{rate=rate===1?0.8:rate===0.8?1.2:1;if(playing)go();else reveal()};
$("sx").onclick=()=>{playing=false;stopTTS();$("show").style.display="none"};

/* اختبر نفسك */
function pageB64(p,w){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,w/i.naturalWidth);c.width=i.naturalWidth*k;c.height=i.naturalHeight*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7).split(",")[1])};i.onerror=no;i.src=B.src(p)})}
async function quiz(){
  const l=lessonOf(n);setCrop(false);
  open_("<h3>🧠 اختبر نفسك: "+esc(l.t)+"</h3><div class='ans' id='qa'>⏳ أحضّر الأسئلة من صفحات الدرس…</div>");
  try{
    let ps=[];for(let p=l.s;p<=l.e;p++)ps.push(p);
    if(ps.length>6)ps=[0,1,2,3,4,5].map(k=>ps[Math.round(k*(ps.length-1)/5)]);
    const imgs=await Promise.all(ps.map(p=>pageB64(p,900)));
    const t=await gem([{text:SYS+"هذه صفحات الدرس «"+l.t+"» من كتاب الرياضيات. ضع 5 أسئلة اختبارية متدرجة الصعوبة (سهل ثم متوسط ثم صعب) تغطي كل أفكار الدرس، بحيث تتضمن كل صيغة السؤال كاملة بالأعداد. أعد JSON فقط بالشكل: [{\"q\":\"نص السؤال\",\"level\":\"سهل\"}]"},...imgs.map(d=>({inline_data:{mime_type:"image/jpeg",data:d}}))],true);
    const qs=JSON.parse(t.replace(/```json|```/g,"").trim());
    const box=$("qa");box.innerHTML="";box.className="";
    qs.forEach((q,k)=>{const d=document.createElement("div");d.className="q";d.innerHTML="<small></small><div class='ans'></div><div class='acts'><button class='chip' data-k='h'>💡 تلميح</button><button class='chip' data-k='s'>✅ الحل مع الشرح</button></div><div class='ans' style='display:none'></div>";
      d.children[0].textContent="سؤال "+(k+1)+" — "+(q.level||"");d.children[1].innerHTML=fmt(q.q);const out=d.children[3];
      d.querySelectorAll("button").forEach(b=>b.onclick=async()=>{out.style.display="block";out.textContent="⏳…";
        try{const r=await gem([{text:SYS+(b.dataset.k==="h"?"الطالب يجد هذا السؤال صعباً. أعطه تلميحاً صغيراً يوجّهه للخطوة الأولى دون كشف الحل:\n":"حلّ هذا السؤال خطوة بخطوة مع شرح كل خطوة:\n")+q.q}]);out.innerHTML=fmt(r);if(b.dataset.k==="s"){const vb=document.createElement("button"),vo=document.createElement("div");vb.className="chip";vb.textContent="🔍 تحقق بنموذج ثانٍ";vo.className="ans";vb.onclick=()=>verify(null,"السؤال: "+q.q+"\nالحل: "+r,vo);out.appendChild(document.createElement("br"));out.appendChild(vb);out.appendChild(vo)}}catch(e){out.textContent=errMsg(e)}});
      box.appendChild(d)});
  }catch(e){if(e.message!=="nokey")$("qa").textContent=e instanceof SyntaxError?"تعذّر تجهيز الأسئلة. أعد المحاولة.":errMsg(e)}
}
$("qb").onclick=quiz;

/* اشرح صورة من عندك */
let photoMode=false,photoData="";
function navMode(ph){photoMode=ph;["nx","pv","qb","cnt"].forEach(id=>$(id).style.display=ph?"none":"");["whole","newp"].forEach(id=>$(id).style.display=ph?"":"none")}
const pc=document.createElement("button");pc.className="card";pc.innerHTML="<b>📷 اشرح صورة من عندك</b><span style='color:var(--mut)'>صوّر تمريناً من أي كتاب أو دفتر ويشرحه الذكاء الاصطناعي</span>";
pc.onclick=pickPhoto;$("homebody").prepend(pc);
function pickPhoto(){
  open_("<h3>📷 اشرح صورة</h3><div class='acts'><button class='pri' id='pc1'>📸 التقاط صورة</button><button class='pri' id='pc2'>🖼️ من المعرض</button></div><p style='color:var(--mut);font-size:13px'>اجعل الصورة واضحة ومضاءة جيداً. وبعد فتحها يمكنك تحديد جزء منها فقط.</p>");
  $("pc1").onclick=()=>$("fcam").click();$("pc2").onclick=()=>$("fgal").click();
}
function loadPhoto(f){
  if(!f)return;const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{const k=Math.min(1,1600/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement("canvas");
    c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
    photoData=c.toDataURL("image/jpeg",.88);URL.revokeObjectURL(u);$("shade").classList.remove("on");openPhoto()};
  i.onerror=()=>{open_("<p>تعذّر فتح هذه الصورة. جرّب صورة أخرى.</p>")};i.src=u;
}
$("fcam").onchange=e=>{loadPhoto(e.target.files[0]);e.target.value=""};
$("fgal").onchange=e=>{loadPhoto(e.target.files[0]);e.target.value=""};
function openPhoto(){navMode(true);show("reader");builtFor=null;stopIO();const bk=$("bk");bk.innerHTML="";const w=mkWrap();w.classList.add("ph");w.firstChild.src=photoData;bk.appendChild(w);$("rt").textContent="📷 صورتك";$("cnt").textContent="";$("scroll").scrollTop=0;setZoom(1);setCrop(false)}
$("whole").onclick=()=>{setCrop(false);explain(photoData.split(",")[1])};
$("newp").onclick=pickPhoto;

  $("k").value=ld("gk");$("m").value=ld("gm")||"gemini-3.5-flash";$("gq").value=ld("gq");$("gv").value=ld("gv")||"qwen/qwen3.8-27b";
  $("sv").onclick=()=>{sv("gk",$("k").value.trim());sv("gm",$("m").value.trim());sv("gq",$("gq").value.trim());sv("gv",$("gv").value.trim());$("shade").classList.remove("on")};
  $("th").onclick=()=>{const d=document.documentElement;d.dataset.theme=getComputedStyle(d).getPropertyValue("--bg").trim()==="#17160f"?"light":"dark"};
}
$("setb").onclick=()=>settings(false);
$("shade").addEventListener("click",e=>{if(e.target.id==="shade")$("shade").classList.remove("on")});
